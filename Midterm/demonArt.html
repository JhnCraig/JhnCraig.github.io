    <script>
        async function loadBreathing() {
            try {
                const response = await fetch("https://www.demonslayer-api.com/api/v1/combat-styles?limit=50&page=1");
                const data = await response.json();
                const breathing = data.content;

                const findBreathing = search => {
                    const query = search.trim().toLowerCase();
                    const exactMatch = breathing.find(c => c.name && c.name.trim().toLowerCase() === query);
                    return exactMatch || breathing.find(c => c.name && c.name.toLowerCase().includes(query));
                };

                const combustible = findBreathing("combustible");
                const swamp = findBreathing("swamp");

                const bewitchment = findBreathing("bewitchment");
                const blindfold  = findBreathing("blindfold ");
                const Hiasobi = findBreathing("Hiasobi");

                const hoketsu = findBreathing("hoketsu");
                const drum = findBreathing("drum");

                const poison = findBreathing("poison");
                const silk = findBreathing("silk");
                const puppetry = findBreathing("puppetry");

                const metamorphosis = findBreathing("metamorphosis");
                const thread = findBreathing("thread");

                const dream = findBreathing("dream");

                const destructive = findBreathing("destructive");
                const obi = findBreathing("obi");

                const blood = findBreathing("blood");
                const cryokinesis = findBreathing("cryokinesis");
                const emotion = findBreathing("emotion");

                const porcelain = findBreathing("porcelain");
                const infinity = findBreathing("infinity");
                const crescent = findBreathing("crescent");

                function render(id, breathing) {
                    const el = document.getElementById(id);
                    if (!el) return; // prevents crash if div missing

                    if (!breathing) {
                        el.innerHTML = "<p>Breathing style not found</p>";
                        return;
                    }

                    el.innerHTML = `
                <div style="display:flex; gap:20px; align-items:flex-start;">
                    <div>
                        <img src="${breathing.img}" width="180" style="border-radius:10px;">
                    </div>

                    <div>
                        <h3>${breathing.name}</h3>
                        <p><strong>Description:</strong> ${breathing.description || "No description"}</p>

                    </div>
                </div>
            `;
                }

                render("combustible", combustible);
                render("swamp", swamp);
                render("bewitchment", bewitchment);
                render("blindfold ", blindfold );
                render("Hiasobi", Hiasobi);
                render("hoketsu", hoketsu);
                render("drum", drum);
                render("poison", poison);
                render("silk", silk);
                render("puppetry", puppetry);
                render("metamorphosis", metamorphosis);
                render("thread", thread);
                render("dream", dream);
                render("destructive", destructive);
                render("obi", obi);
                render("blood", blood);
                render("cryokinesis", cryokinesis);
                render("emotion", emotion);
                render("porcelain", porcelain);
                render("infinity", infinity);
                render("crescent", crescent);

            } catch (err) {
                console.error("ERROR:", err);
            }
        }

        loadBreathing();
    </script>
