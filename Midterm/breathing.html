    <script>
        async function loadBreathing() {
            try {
                const response = await fetch("https://www.demonslayer-api.com/api/v1/combat-styles?limit=50&page=1");
                const data = await response.json();
                const breathing = data.content;

                const findBreathing = search => {
                    const query = search.trim().toLowerCase();
                    const exactMatch = breathing.find(c => c.name && c.name.trim().toLowerCase() === query);
                    return exactMatch || breathing.find(c => c.name && c.name.toLowerCase().includes(query));
                };

                const sun = findBreathing("sun");
                const water = findBreathing("water");

                const thunder = findBreathing("thunder");
                const dual = findBreathing("dual");
                const beast = findBreathing("beast");

                const flower = findBreathing("flower");
                const insect = findBreathing("insect");

                const sound = findBreathing("sound");
                const love = findBreathing("love");
                const flame = findBreathing("flame");

                const mist = findBreathing("mist");
                const stone = findBreathing("stone");

                const serpent = findBreathing("serpent");

                const wind = findBreathing("wind");
                const moon = findBreathing("moon");

                function render(id, breathing) {
                    const el = document.getElementById(id);
                    if (!el) return; // prevents crash if div missing

                    if (!breathing) {
                        el.innerHTML = "<p>Breathing style not found</p>";
                        return;
                    }

                    el.innerHTML = `
                <div style="display:flex; gap:20px; align-items:flex-start;">
                    <div>
                        <img src="${breathing.img}" width="180" style="border-radius:10px;">
                    </div>

                    <div>
                        <h3>${breathing.name}</h3>
                        <p><strong>Description:</strong> ${breathing.description || "No description"}</p>

                    </div>
                </div>
            `;
                }

                render("sun", sun);
                render("water", water);
                render("thunder", thunder);
                render("dual", dual);
                render("beast", beast);
                render("flower", flower);
                render("insect", insect);
                render("sound", sound);
                render("love", love);
                render("flame", flame);
                render("mist", mist);
                render("stone", stone);
                render("serpent", serpent);
                render("wind", wind);
                render("moon", moon);

            } catch (err) {
                console.error("ERROR:", err);
            }
        }

        loadBreathing();
    </script>
