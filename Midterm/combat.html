        }

            filter: invert(1);
        }

        .sticky-sidebar {
            position: sticky;
            top: 90px;
            align-self: flex-start;
            z-index: 2000;
        }

        @media (max-width: 991px) {

            .sticky-sidebar {
                position: static;
                top: auto;
            }

        }

        .navbar {
            top: 0;
            width: 100%;
            z-index: 5000;
        }

        .sidebar {
            top: 70px;
            height: fit-content;
            z-index: 1000;
        }

        .combat-card {
            transition: 0.2s ease;
        }

        .combat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

            <div class="collapse navbar-collapse" id="navbarNav">

                    <li class="nav-item">
                        <a class="nav-link active fs-6 me-4" href="index.html#Home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-6 me-4" href="index.html#features">Features</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>


    <div class="container-fluid px-3 mt-4">

        <div class="row g-3 flex-column flex-lg-row">

            <!-- SIDEBAR -->

                <div class="bg-maroon p-4 rounded text-white">

                    <h2 class="text-center mb-4">Combat Style</h2>

                    <form class="d-flex mb-4">

                        <input class="form-control me-2" type="search" placeholder="Search">

                        <button class="btn btn-outline-light">
                            Search
                        </button>

                    </form>

                    <div class="d-flex justify-content-center mt-3">

                        <a href="characters.html" class="text-decoration-none">

                            <div class="card bg-light text-center mx-auto"
                                style="width: 140px; height: 140px; cursor:pointer;">

                                <img src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/d4cfdf7e-824a-4ffa-bf04-4253a6e64a25/dib70u8-ffd38a6d-f5ba-419c-b116-4b3879c12bc4.png/v1/fill/w_894,h_894/serious_zenitsu__by_3v4d_dib70u8-pre.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7ImhlaWdodCI6Ijw9MTI4MCIsInBhdGgiOiJcL2ZcL2Q0Y2ZkZjdlLTgyNGEtNGZmYS1iZjA0LTQyNTNhNmU2NGEyNVwvZGliNzB1OC1mZmQzOGE2ZC1mNWJhLTQxOWMtYjExNi00YjM4NzljMTJiYzQucG5nIiwid2lkdGgiOiI8PTEyODAifV1dLCJhdWQiOlsidXJuOnNlcnZpY2U6aW1hZ2Uub3BlcmF0aW9ucyJdfQ.kneaIiyLqXrnGQHR3I2nlwPB-mdGPcaprVny-7zuFdM"
                                    class="card-img-top p-2" style="width:100%; height:95px; object-fit:contain;">

            </div>

            <!-- MAIN -->

                <div class="bg-white p-4 rounded">

                    <h3 class="mb-4">
                        Combat Styles
                    </h3>

                    <div class="row g-3" id="characterContainer">

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Modal -->
    <div class="modal fade" id="combatModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="nameHeader"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <h4 id="charactersName" class="mb-2"></h4>
                    <p id="charactersDescription"></p>

                    <hr>

                    <p class="mb-2"><strong>Users:</strong></p>
                    <div id="styleUsers"></div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        // ELEMENTS
        const container =
            document.getElementById("characterContainer");

        // DATA
        let allCombatStyles = [];

        // Create user card
        function createUserCard(user) {

            return `
            <div class="border rounded p-2 mb-2">

                <strong>
                    No. ${user.id || "N/A"} - ${user.name || "Unknown"}
                </strong>

                <p class="mb-0 small text-muted">
                    ${user.description || "No description available."}
                </p>

            </div>
            `;
        }

        // Create combat style card
        function createCombatCard(combat) {

            return `
            <div class="col-12 col-sm-6 col-md-6 col-lg-4">

                <div class="card mb-2 combat-card shadow-sm"
                    data-info='${JSON.stringify(combat)}'
                    style="cursor:pointer">

                    <div class="card-body d-flex align-items-center">

                        <div style="min-width:70px;">
                            <strong>
                                No. ${combat.id || "N/A"}
                            </strong>
                        </div>

                        <div style="flex:1;">
                            <h6 class="mb-0">
                                ${combat.name || "Unknown"}
                            </h6>
                        </div>

                    </div>

                </div>

            </div>
            `;
        }

        // MODAL
        function openCombatModal(character) {

            // TITLE
            document.getElementById("charactersName").textContent =
                character.name || "Unknown";

            document.getElementById("nameHeader").textContent =
                character.name || "Character";

            // DESCRIPTION
            document.getElementById("charactersDescription").textContent =
                character.description || "No description available.";

            // USERS
            const users =
                character.combat_style_character || [];

            const styleUsers =
                document.getElementById("styleUsers");

            styleUsers.innerHTML = users.length

                ? users.map(createUserCard).join("")

                : `
                <p class="text-muted">
                    No users found.
                </p>
            `;

            // SHOW MODAL
            new bootstrap.Modal(
                document.getElementById("combatModal")
            ).show();
        }

        // RENDER        
        function renderCombatStyles(data) {

            if (!data.length) {

                container.innerHTML = `
                <div class="col-12">

                    <div class="alert alert-danger text-center">
                        No combat styles found.
                    </div>

                </div>
            `;

                return;
            }

            // DISPLAY CARDS
            container.innerHTML =
                data.map(createCombatCard).join("");

            // CARD EVENTS
            attachCardEvents();
        }

        // EVENTS        
        function attachCardEvents() {

            document.querySelectorAll(".combat-card")
                .forEach(card => {

                    card.addEventListener("click", () => {

                        const combatData =
                            JSON.parse(card.dataset.info);

                        openCombatModal(combatData);
                    });

                });
        }

        // FETCH DATA
        async function getCombatStyles() {

            try {

                const response = await fetch(
                    "https://www.demonslayer-api.com/api/v1/combat-styles?limit=50&page=1"
                );

                const data = await response.json();

                allCombatStyles = data.content || [];

                renderCombatStyles(allCombatStyles);

            } catch (error) {

                console.error(error);

                container.innerHTML = `
            <div class="col-12">
                <div class="alert alert-danger text-center">
                    Failed to load combat styles.
                </div>
            </div>
        `;
            }
        }

        getCombatStyles();

    </script>

    <script>
        function autoCloseNavbar() {
            const navbar = document.getElementById("navbarNav");

            const bsCollapse = bootstrap.Collapse.getInstance(navbar);

            if (bsCollapse) {
                bsCollapse.hide();
            }
        }

        document.querySelectorAll(".navbar-nav .nav-link")
            .forEach(link => {
                link.addEventListener("click", autoCloseNavbar);
            });
    </script>

</body>

</html>
