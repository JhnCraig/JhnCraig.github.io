<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demon Slayer - Combat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .bg-maroon {
            background-color: #800000 !important;
        }

        .bg-maroon .nav-link,
        .bg-maroon .navbar-brand {
            color: white !important;
        }

        body {
            padding-top: 70px;
        }

        .navbar-collapse {
            background-color: #800000;
            text-align: center;
            z-index: 3100;
        }

        .navbar-nav .nav-link {
            padding: 10px;
            font-size: 18px;
        }

        .navbar-toggler {
            border: none;
        }

        .navbar-toggler-icon {
            filter: invert(1);
        }

        .sticky-sidebar {
            position: sticky;
            top: 90px;
            align-self: flex-start;
            z-index: 2000;
        }

        @media (max-width: 991px) {

            .sticky-sidebar {
                position: static;
                top: auto;
            }

        }

        .navbar {
            top: 0;
            width: 100%;
            z-index: 5000;
        }

        .sidebar {
            top: 70px;
            height: fit-content;
            z-index: 1000;
        }

        .combat-card {
            transition: 0.2s ease;
        }

        .combat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .modal-z {
            z-index: 5000;
        }

        /* Feature card border adapts to theme */
        .feature-card {
            background-color: white !important;
            color: black !important;

            border-radius: 15px !important;
            transition: 0.3s ease;
        }

        /* LIGHT MODE */
        [data-bs-theme="light"] .feature-card {
            border: 3px solid #800000 !important;

            box-shadow: 0 0 15px rgba(128, 0, 0, 0.4);
        }

        /* DARK MODE */
        [data-bs-theme="dark"] .feature-card {
            border: 3px solid #ff4d4d !important;

            box-shadow: 0 0 20px rgba(255, 77, 77, 0.5);
        }

        .feature-card .card-body,
        .feature-card .card-text,
        .feature-card .h4 {
            color: black !important;
        }

        #modeBtn {
            width: 130px;
        }

        /* SEARCH ALWAYS DARK */
        .search-box {
            background-color: #ffffff !important;
            color: white !important;
            border: 1px solid #444 !important;
        }

        .search-box::placeholder {
            color: #212529 !important;
        }

        /* DEFAULT = WHITE */
        #characterMain {
            background-color: #212529;
            color: rgb(255, 255, 255);
            transition: 0.3s ease;
        }

        /* DARK MODE */
        [data-bs-theme="dark"] #characterMain {
            background-color: #ffffff;
            color: #212529;
        }

        /* Modal*/
        .theme-modal .modal-content {
            background-color: #212529;
            color: #ffffff;
            transition: 0.3s ease;
        }

        .theme-modal .modal-header,
        .theme-modal .modal-footer,
        .theme-modal .modal-body {
            background-color: #212529;
            color: #ffffff;
        }

        /* DARK MODE */
        [data-bs-theme="dark"] .theme-modal .modal-content {
            background-color: #ffffff;
            color: #212529;
        }

        [data-bs-theme="dark"] .theme-modal .modal-header,
        [data-bs-theme="dark"] .theme-modal .modal-footer,
        [data-bs-theme="dark"] .theme-modal .modal-body {
            background-color: #ffffff;
            color: #212529;
        }

        /* CLOSE BUTTON */
        .btn-close {
            filter: none;
        }

        [data-bs-theme="dark"] .btn-close {
            filter: none;
        }
    </style>
</head>

<body id="body" data-bs-theme="dark">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md bg-maroon fixed-top shadow">
        <div class="container-fluid">

            <a class="navbar-brand ms-3" href="#Home">
                <div class="h2">DEMON SLAYER</div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active fs-6 me-4" href="index.html#Home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-6 me-4" href="index.html#features">Features</a>
                    </li>
                </ul>

                <button id="modeBtn" onclick="switchTheme()" class="btn btn-maroon text-white shadow me-3">
                    Dark Mode
                </button>

            </div>

        </div>
    </nav>


    <div class="container-fluid px-3 mt-4">

        <div class="row g-3 flex-column flex-lg-row">

            <!-- SIDEBAR -->
            <div class="col-12 col-lg-4 sticky-sidebar order-1 order-lg-1 fixed-top-lg">
                <div class="bg-maroon p-4 rounded text-white">

                    <div class="text-center mb-4 h2">Combat Style</div>

                    <form class="d-flex mb-4">
                        <input class="form-control search-box me-2" type="search" placeholder="Search">

                        <button class="btn btn-outline-light">
                            Search
                        </button>
                    </form>

                    <div class="d-flex justify-content-center mt-3">
                        <a href="characters.html" class="text-decoration-none">

                            <div class="card bg-light text-center mx-auto feature-card"
                                style="width: 140px; height: 140px; cursor:pointer;">

                                <img src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/d4cfdf7e-824a-4ffa-bf04-4253a6e64a25/dib70u8-ffd38a6d-f5ba-419c-b116-4b3879c12bc4.png/v1/fill/w_894,h_894/serious_zenitsu__by_3v4d_dib70u8-pre.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7ImhlaWdodCI6Ijw9MTI4MCIsInBhdGgiOiJcL2ZcL2Q0Y2ZkZjdlLTgyNGEtNGZmYS1iZjA0LTQyNTNhNmU2NGEyNVwvZGliNzB1OC1mZmQzOGE2ZC1mNWJhLTQxOWMtYjExNi00YjM4NzljMTJiYzQucG5nIiwid2lkdGgiOiI8PTEyODAifV1dLCJhdWQiOlsidXJuOnNlcnZpY2U6aW1hZ2Uub3BlcmF0aW9ucyJdfQ.kneaIiyLqXrnGQHR3I2nlwPB-mdGPcaprVny-7zuFdM"
                                    class="card-img-top p-2" style="width:100%; height:95px; object-fit:contain;">

                                <div class="card-body p-1 d-flex align-items-center justify-content-center">

                                    <small class="fw-bold text-dark">
                                        Characters
                                    </small>

                                </div>

                            </div>

                        </a>
                    </div>

                </div>
            </div>

            <!-- MAIN -->
            <div class="col-12 col-lg-8 order-2 order-lg-2">

                <div id="characterMain" class="main-panel p-4 rounded">

                    <div class="mb-4 h3">
                        Combat Styles
                    </div>

                    <div class="row g-3" id="characterContainer">

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Modal -->
    <div class="modal fade modal-z theme-modal" id="combatModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <div class="modal-title h5" id="nameHeader"></div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div id="charactersName" class="mb-2 h4"></div>
                    <div class="p" id="charactersDescription"></div>

                    <hr>

                    <div class="mb-2 p"><strong>Users:</strong></div>
                    <div id="styleUsers"></div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        // ELEMENTS
        const container =
            document.getElementById("characterContainer");

        // DATA
        let allCombatStyles = [];

        // Create user card
        function createUserCard(user) {

            return `
            <div class="border rounded p-2 mb-2">

                <strong>
                    No. ${user.id || "N/A"} - ${user.name || "Unknown"}
                </strong>

                <p class="mb-0 small text-muted">
                    ${user.description || "No description available."}
                </p>

            </div>
            `;
        }

        // Create combat style card
        function createCombatCard(combat) {

            return `
            <div class="col-12 col-sm-6 col-md-6 col-lg-4">

                <div id="characterMain" class="card mb-2 combat-card shadow border"
                    data-info='${JSON.stringify(combat)}'
                    style="cursor:pointer">

                    <div class="card-body d-flex align-items-center">

                        <div style="min-width:70px;">
                            <strong>
                                No. ${combat.id || "N/A"}
                            </strong>
                        </div>

                        <div style="flex:1;">
                            <div class="h6 mb-0">
                                ${combat.name || "Unknown"}
                            </div>
                        </div>

                    </div>

                </div>

            </div>
            `;
        }

        // MODAL
        function openCombatModal(character) {

            // TITLE
            document.getElementById("charactersName").textContent =
                character.name || "Unknown";

            document.getElementById("nameHeader").textContent =
                character.name || "Character";

            // DESCRIPTION
            document.getElementById("charactersDescription").textContent =
                character.description || "No description available.";

            // USERS
            const users =
                character.combat_style_character || [];

            const styleUsers =
                document.getElementById("styleUsers");

            styleUsers.innerHTML = users.length

                ? users.map(createUserCard).join("")

                : `
                <div class="p" class="text-muted">
                    No users found.
                </div>
            `;

            // SHOW MODAL
            new bootstrap.Modal(
                document.getElementById("combatModal")
            ).show();
        }

        // RENDER        
        function renderCombatStyles(data) {

            if (!data.length) {

                container.innerHTML = `
                <div class="col-12">

                    <div class="alert alert-danger text-center">
                        No combat styles found.
                    </div>

                </div>
            `;

                return;
            }

            // DISPLAY CARDS
            container.innerHTML =
                data.map(createCombatCard).join("");

            // CARD EVENTS
            attachCardEvents();
        }

        // EVENTS        
        function attachCardEvents() {

            document.querySelectorAll(".combat-card")
                .forEach(card => {

                    card.addEventListener("click", () => {

                        const combatData =
                            JSON.parse(card.dataset.info);

                        openCombatModal(combatData);
                    });

                });
        }

        // FETCH DATA
        async function getCombatStyles() {

            try {

                const response = await fetch(
                    "https://www.demonslayer-api.com/api/v1/combat-styles?limit=50&page=1"
                );

                const data = await response.json();

                allCombatStyles = data.content || [];

                renderCombatStyles(allCombatStyles);

            } catch (error) {

                console.error(error);

                container.innerHTML = `
            <div class="col-12">
                <div class="alert alert-danger text-center">
                    Failed to load combat styles.
                </div>
            </div>
        `;
            }
        }

        getCombatStyles();

    </script>

    <script>
        function autoCloseNavbar() {
            const navbar = document.getElementById("navbarNav");

            const bsCollapse = bootstrap.Collapse.getInstance(navbar);

            if (bsCollapse) {
                bsCollapse.hide();
            }
        }

        document.querySelectorAll(".navbar-nav .nav-link")
            .forEach(link => {
                link.addEventListener("click", autoCloseNavbar);
            });

        // Dark Mode
        var mode = "Light";
        var body = document.getElementById("body");
        var modeBtn = document.getElementById("modeBtn");

        // Get the current theme from the body
        var mode = body.getAttribute("data-bs-theme") === "dark" ? "Dark" : "Light";
        modeBtn.innerText = mode === "Dark" ? "Light Mode" : "Dark Mode";

        function switchTheme() {
            if (mode == "Light") {
                mode = "Dark";
                modeBtn.innerText = "Light Mode";
            } else {
                mode = "Light";
                modeBtn.innerText = "Dark Mode";
            }

            body.setAttribute("data-bs-theme", mode.toLowerCase());
        }
    </script>

</body>

</html>
