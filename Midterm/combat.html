<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        }

            z-index: 1050 !important;
        }

        .sticky-sidebar {
            position: sticky;
            top: 5.5rem;
            align-self: flex-start;
            z-index: 1020;
        }

        .combat-card {
            transition: 0.2s ease;
        }

        .combat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body class="bg-dark">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-maroon fixed-top">
        <div class="container-fluid" style="height: 62px;">
            <a class="navbar-brand ms-3" href="#Home">
                <h2>DEMON SLAYER</h2>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active fs-6 me-4" href="index.html#Home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-6 me-4" href="index.html#features">Features</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="row flex-column flex-lg-row">

            <!-- SIDEBAR -->
            <div class="col-12 col-lg-4 sticky-sidebar order-1 order-lg-1" style="margin-top: 78px;">

                <div class="bg-maroon p-4 rounded h-100 text-white">

                    <h2 class="text-center mb-4">Combat Style</h2>

                    <form class="d-flex mb-4">
                        <input class="form-control me-2" type="search" placeholder="Search">
                        <button class="btn btn-outline-light">Search</button>
                    </form>

                    <div class="d-flex justify-content-center mt-3">

                        <a href="characters.html" class="text-decoration-none">

                            <div class="card bg-light text-center mx-auto"
                                style="width: 110px; height: 110px; cursor:pointer;">

                                <img src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/d4cfdf7e-824a-4ffa-bf04-4253a6e64a25/dib70u8-ffd38a6d-f5ba-419c-b116-4b3879c12bc4.png/v1/fill/w_894,h_894/serious_zenitsu__by_3v4d_dib70u8-pre.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7ImhlaWdodCI6Ijw9MTI4MCIsInBhdGgiOiJcL2ZcL2Q0Y2ZkZjdlLTgyNGEtNGZmYS1iZjA0LTQyNTNhNmU2NGEyNVwvZGliNzB1OC1mZmQzOGE2ZC1mNWJhLTQxOWMtYjExNi00YjM4NzljMTJiYzQucG5nIiwid2lkdGgiOiI8PTEyODAifV1dLCJhdWQiOlsidXJuOnNlcnZpY2U6aW1hZ2Uub3BlcmF0aW9ucyJdfQ.kneaIiyLqXrnGQHR3I2nlwPB-mdGPcaprVny-7zuFdM"
                                    style="width: 100%; height: 80px; object-fit: contain;" class="card-img-top p-2">

                                <div class="card-body p-1 d-flex align-items-center justify-content-center">
                                    <small class="fw-bold text-dark">Characters</small>
                                </div>

                            </div>

                        </a>

                    </div>

                </div>

            </div>

            <!-- MAIN -->
            <div class="col-12 col-lg-8 order-2 order-lg-2">

                <div class="bg-white p-4 rounded h-100" style="margin-top: 78px;">

                    <h5 class="mb-3">Combat Styles</h5>

                    <div class="row g-2" id="characterContainer"></div>

                </div>

            </div>

        </div>

    </div>

    <!-- Modal -->
    <div class="modal fade" id="combatModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="modalNameHeader"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <h4 id="modalName" class="mb-2"></h4>
                    <p id="modalDescription"></p>

                    <hr>

                    <p class="mb-2"><strong>Users:</strong></p>
                    <div id="modalUsers"></div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const container = document.getElementById("characterContainer");
        let allCharacters = [];

        // MODAL
        const openCombatModal = (c) => {

            document.getElementById("modalName").textContent = c.name || "Unknown";
            document.getElementById("modalNameHeader").textContent = c.name || "Character";
            document.getElementById("modalDescription").textContent = c.description || "No description available.";

            const users = c.combat_style_character || [];

            document.getElementById("modalUsers").innerHTML =
                users.length
                    ? users.map(u => `
                <div class="border rounded p-2 mb-2">
                    <strong>No. ${u.id} - ${u.name}</strong>
                    <p class="mb-0 small text-muted">${u.description}</p>
                </div>
            `).join("")
                    : "<p class='text-muted'>No users found.</p>";

            new bootstrap.Modal(document.getElementById("combatModal")).show();
        };

        // RENDER
        const render = (data) => {

            container.innerHTML = data.map(c => `
        <div class="col-12 col-sm-6 col-md-6 col-lg-4">

            <div class="card mb-2 combat-card shadow-sm"
                data-info='${JSON.stringify(c)}'
                style="cursor:pointer">

                <div class="card-body d-flex align-items-center">

                    <div style="min-width:70px;">
                        <strong>No. ${c.id || "N/A"}</strong>
                    </div>

                    <div style="flex:1;">
                        <h6 class="mb-0">${c.name || "Unknown"}</h6>
                    </div>

                </div>

            </div>

        </div>
    `).join("");

            document.querySelectorAll(".combat-card").forEach(card => {
                card.onclick = () => openCombatModal(JSON.parse(card.dataset.info));
            });
        };

        // FETCH
        const getData = () => {

            fetch("https://www.demonslayer-api.com/api/v1/combat-styles?limit=50&page=1")
                .then(res => res.json())
                .then(data => {
                    allCharacters = data.content || [];
                    render(allCharacters);
                });

        };

        getData();

    </script>   

</body>

</html>
