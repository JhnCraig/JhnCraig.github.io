                    <form class="d-flex mb-4">

                    <!-- CARD -->
                    <div class="d-flex justify-content-center mt-3">

                        <a href="characters.html" class="text-decoration-none">

                                style="width: 110px; height: 110px; cursor:pointer;">

                                <img src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/d4cfdf7e-824a-4ffa-bf04-4253a6e64a25/dib70u8-ffd38a6d-f5ba-419c-b116-4b3879c12bc4.png/v1/fill/w_894,h_894/serious_zenitsu__by_3v4d_dib70u8-pre.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7ImhlaWdodCI6Ijw9MTI4MCIsInBhdGgiOiJcL2ZcL2Q0Y2ZkZjdlLTgyNGEtNGZmYS1iZjA0LTQyNTNhNmU2NGEyNVwvZGliNzB1OC1mZmQzOGE2ZC1mNWJhLTQxOWMtYjExNi00YjM4NzljMTJiYzQucG5nIiwid2lkdGgiOiI8PTEyODAifV1dLCJhdWQiOlsidXJuOnNlcnZpY2U6aW1hZ2Uub3BlcmF0aW9ucyJdfQ.kneaIiyLqXrnGQHR3I2nlwPB-mdGPcaprVny-7zuFdM"

                            </div>

                    </div>

                </div>

            <!-- MAIN -->

                <div class="bg-white p-4 rounded h-100" style="margin-top: 78px;">

                    <h5 class="mb-3">Combat Styles</h5>

                    <div class="row g-2" id="characterContainer"></div>

                </div>

            </div>

        </div>

    </div>

    <!-- Modal for Combat Style -->
    <div class="modal fade" id="combatModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="modalNameHeader"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <h4 id="modalName" class="mb-2"></h4>

                    <p id="modalDescription"></p>

                    <hr>

                    <p class="mb-2"><strong>Users:</strong></p>
                    <div id="modalUsers"></div>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

    <script>

        const container = document.getElementById("characterContainer");

        let allCharacters = [];

        // OPEN MODAL
        const openCombatModal = (character) => {

            document.getElementById("modalName").textContent =
                character.name || "Unknown";

            document.getElementById("modalNameHeader").textContent =
                character.name || "Character";

            document.getElementById("modalDescription").textContent =
                character.description || "No description available.";

            const usersContainer = document.getElementById("modalUsers");
            const users = character.combat_style_character || [];

            if (users.length === 0) {
                usersContainer.innerHTML = "<p class='text-muted'>No users found.</p>";
            } else {
                usersContainer.innerHTML = users.map(user => `
            <div class="border rounded p-2 mb-2">
                <strong>No. ${user.id} - ${user.name}</strong>
                <p class="mb-0 small text-muted">${user.description}</p>
            </div>
        `).join("");
            }

            new bootstrap.Modal(document.getElementById("combatModal")).show();
        };

        // RENDER FUNCTION (FIXED)
        const render = (characters) => {

            container.innerHTML = characters.map(character => {

                const id = character.id ?? "N/A";

                return `
        <div class="col-12 col-sm-6 col-md-6 col-lg-4">

            <div class="card shadow-sm mb-2 combat-card"
                style="cursor:pointer"
                data-info='${JSON.stringify(character)}'>

                <div class="card-body d-flex align-items-center">

                    <div style="min-width:70px;">
                        <strong>No. ${id}</strong>
                    </div>

                    <div style="flex:1;">
                        <h6 class="mb-0">${character.name || "Unknown"}</h6>
                    </div>

                </div>

            </div>

        </div>
        `;
            }).join("");

            document.querySelectorAll(".combat-card").forEach(card => {
                card.addEventListener("click", () => {
                    openCombatModal(JSON.parse(card.dataset.info));
                });
            });
        };

        // FETCH DATA
        const getData = async () => {
            try {
                const res = await fetch("https://www.demonslayer-api.com/api/v1/combat-styles?limit=50&page=1");
                const data = await res.json();

                allCharacters = data.content || [];
                render(allCharacters);

            } catch (err) {
                console.error("Fetch error:", err);
            }
        };

        getData();

    </script>

</body>

</html>
