<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .bg-maroon {
            background-color: #800000 !important;
        }

        .bg-maroon .nav-link,
        .bg-maroon .navbar-brand {
            color: white !important;
        }

        .sticky-navbar {
            position: sticky;
            top: 0;
            z-index: 1030;
        }

        .sticky-sidebar {
            position: sticky;
            top: 5.5rem;
            align-self: flex-start;
            z-index: 1020;
        }

        .character-card {
            transition: 0.2s ease;
        }

        .character-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .navbar {
            z-index: 1050 !important;
        }
    </style>
</head>

<body class="bg-dark">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-maroon fixed-top">
        <div class="container-fluid" style="height: 62px;">
            <a class="navbar-brand ms-3" href="#Home">
                <h2>DEMON SLAYER</h2>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active fs-6 me-4" href="index.html#Home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-6 me-4" href="index.html#features">Features</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <!-- ROW (STACK FIXED) -->
        <div class="row flex-column flex-lg-row">

            <!-- SIDEBAR -->
            <div class="col-12 col-lg-4 sticky-sidebar order-1 order-lg-1" style="margin-top: 78px;">

                <div class="bg-maroon p-4 rounded h-100 text-white">

                    <h2 class="text-center mb-4">Characters</h2>

                    <form class="d-flex mb-4">
                        <input class="form-control me-2" type="search" placeholder="Search">
                        <button class="btn btn-outline-light">Search</button>
                    </form>

                    <div class="d-flex justify-content-center mt-3">

                        <a href="combat.html" class="text-decoration-none">

                            <div class="card bg-light text-center mx-auto"
                                style="width: 110px; height: 110px; cursor:pointer;">

                                <img src="https://tse1.mm.bing.net/th/id/OIP.ODvEHo24cD1j42I2gTY6pAHaFN?rs=1&pid=ImgDetMain&o=7&rm=3"
                                    style="width: 100%; height: 80px; object-fit: contain;" class="card-img-top p-2">

                                <div class="card-body p-1 d-flex align-items-center justify-content-center">
                                    <small class="fw-bold text-dark">Combat Styles</small>
                                </div>

                            </div>

                        </a>

                    </div>

                </div>

            </div>

            <!-- MAIN -->
            <div class="col-12 col-lg-8 order-2 order-lg-2">

                <div class="bg-white p-4 rounded h-100" style="margin-top: 78px;">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h5 class="mb-0">Character List</h5>

                        <select class="form-select form-select-sm" id="raceFilter" style="width: 160px;">
                            <option value="all">All Races</option>
                        </select>

                    </div>

                    <div class="row g-2" id="characterContainer"></div>

                </div>

            </div>

        </div>

    </div>

    <!-- Modal -->
    <div class="modal fade" id="characterModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Character Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="row">

                        <div class="col-md-5 text-center">
                            <img id="modalImg" class="img-fluid rounded" style="max-height: 300px;">
                        </div>

                        <div class="col-md-7">
                            <h3 id="modalName"></h3>

                            <p><strong>Age:</strong> <span id="modalAge"></span></p>
                            <p><strong>Gender:</strong> <span id="modalGender"></span></p>
                            <p><strong>Race:</strong> <span id="modalRace"></span></p>

                            <p class="mt-3">
                                <strong>Description:</strong><br>
                                <span id="modalDescription"></span>
                            </p>

                            <p class="mt-3 fst-italic">
                                "<span id="modalQuote"></span>"
                            </p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const container = document.getElementById("characterContainer");
        const searchInput = document.querySelector("input[type='search']");
        const raceFilter = document.getElementById("raceFilter");

        let allCharacters = [];
        let selectedRace = "all";

        // MODAL
        const openModal = (c) => {

            document.getElementById("modalImg").src = c.img || c.image || "";
            document.getElementById("modalName").textContent = c.name || "Unknown";
            document.getElementById("modalAge").textContent = c.age || "N/A";
            document.getElementById("modalGender").textContent = c.gender || "N/A";
            document.getElementById("modalRace").textContent = c.race || "N/A";
            document.getElementById("modalDescription").textContent = c.description || "No description available.";
            document.getElementById("modalQuote").textContent = c.quote || "No quote available.";

            new bootstrap.Modal(document.getElementById("characterModal")).show();
        };

        // RENDER
        const render = (data) => {

            container.innerHTML = data.map(c => {

                const raceColor =
                    c.race?.toLowerCase() === "human"
                        ? "bg-primary"
                        : c.race?.toLowerCase() === "demon"
                            ? "bg-danger"
                            : "bg-secondary";

                return `
                <div class="col-12">
                    <div class="card mb-2 character-card shadow-sm"
                        data-id='${JSON.stringify(c)}'
                        style="cursor:pointer">

                        <div class="card-body d-flex justify-content-between align-items-center">

                            <div style="min-width:120px;">
                                <strong>No. ${c.id}</strong>
                            </div>

                            <div style="flex:1;">
                                <h5 class="mb-0">${c.name || "Unknown"}</h5>
                            </div>

                            <div style="min-width:120px; text-align:right;">
                                <span class="badge ${raceColor}">
                                    ${c.race || "N/A"}
                                </span>
                            </div>

                        </div>
                    </div>
                </div>
                `;
            }).join("");

            document.querySelectorAll(".character-card").forEach(card => {
                card.onclick = () => openModal(JSON.parse(card.dataset.id));
            });
        };

        // FILTER OPTIONS
        const fillRaceOptions = (data) => {

            const races = [...new Set(data.map(c => c.race).filter(Boolean))];

            raceFilter.innerHTML =
                `<option value="all">All Races</option>` +
                races.map(r => `<option value="${r}">${r}</option>`).join("");
        };

        // FILTER
        const applyFilters = () => {

            const value = searchInput.value.toLowerCase();

            const filtered = allCharacters
                .filter(c =>
                    (c.name || "").toLowerCase().includes(value) ||
                    (c.race || "").toLowerCase().includes(value) ||
                    String(c.id).includes(value)
                )
                .filter(c =>
                    selectedRace === "all" || c.race === selectedRace
                );

            render(filtered);
        };

        // FETCH
        const getData = () => {

            fetch("https://www.demonslayer-api.com/api/v1/characters?limit=45&page=1")
                .then(res => res.json())
                .then(data => {
                    allCharacters = data.content || [];
                    render(allCharacters);
                    fillRaceOptions(allCharacters);
                });

        };

        // EVENTS
        searchInput.oninput = applyFilters;

        raceFilter.onchange = (e) => {
            selectedRace = e.target.value;
            applyFilters();
        };

        getData();

    </script>

</body>

</html>
