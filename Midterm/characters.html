<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .bg-maroon {
            background-color: #800000 !important;
        }

        .bg-maroon .nav-link,
        .bg-maroon .navbar-brand {
            color: white !important;
        }

        .sticky-navbar {
            position: sticky;
            top: 0;
            z-index: 1030;
        }

        .sticky-sidebar {
            position: sticky;
            top: 5.5rem;
            align-self: flex-start;
        }
    </style>
</head>

<body class="bg-dark">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-maroon fixed-top">
        <div class="container-fluid" style="height: 62px;">
            <a class="navbar-brand ms-3" href="#Home">
                <h2>DEMON SLAYER</h2>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>


            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active fs-6 me-4" aria-current="page" href="#Home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-6 me-4" href="#features">Features</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">

            <!-- SIDEBAR -->
            <div class="col-auto sticky-sidebar" style="width: 420px; margin-top: 78px;">
                <div class="bg-maroon p-4 rounded h-100 text-white">
                    <h2 class="text-center mb-4">Characters</h2>

                    <form class="d-flex mb-4">
                        <input class="form-control me-2" type="search" placeholder="Search">
                        <button class="btn btn-outline-light">Search</button>
                    </form>

                    <div class="mt-3">
                        <a href="combat.html" class="text-decoration-none">

                            <div class="card bg-light text-center mx-auto"
                                style="width: 110px; height: 110px; cursor:pointer;">

                                <img src="https://tse1.mm.bing.net/th/id/OIP.ODvEHo24cD1j42I2gTY6pAHaFN?rs=1&pid=ImgDetMain&o=7&rm=3"
                                    alt="Demon" style="width: 100%; height: 80px; object-fit: contain;"
                                    class="card-img-top p-2">

                                <div class="card-body p-1 d-flex align-items-center justify-content-center">
                                    <small class="fw-bold text-dark">Combat Style</small>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Characters -->
            <div class="col">
                <div class="bg-white p-4 rounded h-100" style="margin-top: 78px;">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h5 class="mb-0">Character List</h5>

                        <!-- RACE FILTER -->
                        <select class="form-select form-select-sm" id="raceFilter" style="width: 160px;">
                            <option value="all">All Races</option>
                        </select>

                    </div>

                    <div class="row g-2" id="characterContainer"></div>

                </div>
            </div>

            <!-- Modal for Character -->
            <div class="modal fade" id="characterModal" tabindex="-1">
                <div class="modal-dialog modal-lg modal-dialog-centered">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">Character Details</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            <div class="row">

                                <div class="col-md-5 text-center">
                                    <img id="modalImg" class="img-fluid rounded" style="max-height: 300px;">
                                </div>

                                <div class="col-md-7">
                                    <h3 id="modalName"></h3>

                                    <p><strong>Age:</strong> <span id="modalAge"></span></p>
                                    <p><strong>Gender:</strong> <span id="modalGender"></span></p>
                                    <p><strong>Race:</strong> <span id="modalRace"></span></p>

                                    <p class="mt-3">
                                        <strong>Description:</strong><br>
                                        <span id="modalDescription"></span>
                                    </p>

                                    <p class="mt-3 fst-italic">
                                        "<span id="modalQuote"></span>"
                                    </p>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>


    <script>
        const openModal = (character) => {

            document.getElementById("modalImg").src =
                character.img || character.image || "";

            document.getElementById("modalName").textContent =
                character.name || "Unknown";

            document.getElementById("modalAge").textContent =
                character.age || "N/A";

            document.getElementById("modalGender").textContent =
                character.gender || "N/A";

            document.getElementById("modalRace").textContent =
                character.race || "N/A";

            document.getElementById("modalDescription").textContent =
                character.description || "No description available.";

            document.getElementById("modalQuote").textContent =
                character.quote || "No quote available.";

            const modal = new bootstrap.Modal(document.getElementById("characterModal"));
            modal.show();
        };

        const container = document.getElementById("characterContainer");
        const searchInput = document.querySelector("input[type='search']");
        const raceFilter = document.getElementById("raceFilter");

        let allCharacters = [];
        let selectedRace = "all";

        // RENDER
        const render = (characters) => {
            let output = "";

            characters.forEach((character) => {

                // 🎨 RACE COLOR LOGIC
                let raceColor = "bg-secondary";

                if (character.race?.toLowerCase() === "human") {
                    raceColor = "bg-primary"; // blue
                } else if (character.race?.toLowerCase() === "demon") {
                    raceColor = "bg-danger"; // red
                }

                output += `
                <div class="col-12">
                    <div class="card shadow-sm mb-2 character-card" 
                        style="cursor:pointer"
                        data-id='${JSON.stringify(character)}'>

                        <div class="card-body d-flex align-items-center justify-content-between">

                            <div style="min-width:120px;">
                                <strong>No. ${character.id}</strong>
                            </div>

                            <div style="flex:1;">
                                <h5 class="mb-0">${character.name || "Unknown"}</h5>
                            </div>

                            <div style="min-width:120px; text-align:right;">
                                <span class="badge ${raceColor}">
                                    ${character.race || "N/A"}
                                </span>
                            </div>

                        </div>
                    </div>
                </div>
                `;
            });

            container.innerHTML = output;

            // CLICK EVENTS (keep yours)
            document.querySelectorAll(".character-card").forEach(card => {
                card.addEventListener("click", () => {
                    const data = JSON.parse(card.dataset.id);
                    openModal(data);
                });
            });
        };

        // FILL RACE DROPDOWN
        const fillRaceOptions = (characters) => {
            const races = [...new Set(characters.map(c => c.race).filter(Boolean))];

            races.forEach(race => {
                const option = document.createElement("option");
                option.value = race;
                option.textContent = race;
                raceFilter.appendChild(option);
            });
        };

        // FILTER LOGIC (search + race)
        const applyFilters = () => {
            const searchValue = searchInput.value.toLowerCase();

            const filtered = allCharacters.filter((char) => {
                const matchSearch =
                    char.name?.toLowerCase().includes(searchValue) ||
                    char.race?.toLowerCase().includes(searchValue) ||
                    String(char.id).includes(searchValue);

                const matchRace =
                    selectedRace === "all" || char.race === selectedRace;

                return matchSearch && matchRace;
            });

            render(filtered);
        };

        // FETCH DATA
        const getData = async () => {
            try {
                const response = await fetch(
                    "https://www.demonslayer-api.com/api/v1/characters?limit=45&page=1"
                );

                const data = await response.json();
                allCharacters = data.content || [];

                render(allCharacters);
                fillRaceOptions(allCharacters);

            } catch (error) {
                console.error("Error fetching data:", error);
            }
        };

        // SEARCH INPUT
        searchInput.addEventListener("input", applyFilters);

        // RACE FILTER
        raceFilter.addEventListener("change", (e) => {
            selectedRace = e.target.value;
            applyFilters();
        });

        getData();
    </script>

</body>

</html>
