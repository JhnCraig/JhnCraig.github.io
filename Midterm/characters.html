<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .bg-maroon {
            background-color: #800000 !important;
        }

        .bg-maroon .nav-link,
        .bg-maroon .navbar-brand {
            color: white !important;
        }

        .sticky-navbar {
            position: sticky;
            top: 0;
            z-index: 1030;
        }

        .sticky-sidebar {
            position: sticky;
            top: 90px;
            align-self: flex-start;
            z-index: 2000;
        }

        @media (max-width: 991px) {

            .sticky-sidebar {
                position: static;
                top: auto;
            }

        }

        .navbar {
            top: 0;
            width: 100%;
            z-index: 5000;
        }

        .sidebar {
            top: 70px;
            height: fit-content;
            z-index: 1000;
        }

        .character-card {
            transition: 0.2s ease;
        }

        .character-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        body {
            padding-top: 70px;
        }

        .navbar-collapse {
            background-color: #800000;
            text-align: center;
            z-index: 3100;
        }

        .navbar-nav .nav-link {
            padding: 10px;
            font-size: 18px;
        }

        .navbar-toggler {
            border: none;
        }

        .navbar-toggler-icon {
            filter: invert(1);
        }


        body {
            overflow-x: hidden;
        }

        .character-card .card-body {
            gap: 10px;
            flex-wrap: wrap;
        }

        .character-card .badge {
            font-size: 10px;
            white-space: nowrap;
        }

        @media (max-width: 576px) {

            .character-card .card-body {
                align-items: flex-start !important;
            }

            .character-card h5 {
                font-size: 16px;
            }

            .form-select-sm {
                width: 120px !important;
            }
        }

        @media (max-width: 991px) {

            .sticky-sidebar {
                margin-bottom: 25px;
            }

            .bg-white {
                margin-top: 0 !important;
            }
        }
    </style>
</head>

<body class="bg-dark">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md bg-maroon fixed-top shadow">
        <div class="container-fluid">

            <a class="navbar-brand ms-3" href="#Home">
                <h2>DEMON SLAYER</h2>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active fs-6 me-4" href="index.html#Home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-6 me-4" href="index.html#features">Features</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <div class="container-fluid px-3 mt-4">

        <div class="row g-3 flex-column flex-lg-row">

            <!-- SIDEBAR -->
            <div class="col-12 col-lg-4 sticky-sidebar order-1 order-lg-1">

                <div class="bg-maroon p-4 rounded text-white">

                    <h2 class="text-center mb-4">
                        Characters
                    </h2>

                    <form class="d-flex mb-4">

                        <input class="form-control me-2" type="search" placeholder="Search">

                        <button class="btn btn-outline-light">
                            Search
                        </button>

                    </form>

                    <div class="d-flex justify-content-center mt-3">

                        <a href="combat.html" class="text-decoration-none">

                            <div class="card bg-light text-center mx-auto"
                                style="width: 140px; height: 140px; cursor:pointer;">

                                <img src="https://tse1.mm.bing.net/th/id/OIP.ODvEHo24cD1j42I2gTY6pAHaFN?rs=1&pid=ImgDetMain&o=7&rm=3"
                                    class="card-img-top p-2" style="width:100%; height:95px; object-fit:contain;">

                                <div class="card-body p-1 d-flex align-items-center justify-content-center">

                                    <small class="fw-bold text-dark">
                                        Combat Styles
                                    </small>

                                </div>

                            </div>

                        </a>

                    </div>

                </div>

            </div>

            <!-- MAIN -->
            <div class="col-12 col-lg-8 order-2 order-lg-2">

                <div class="bg-white p-4 rounded">

                    <div class="d-flex justify-content-between align-items-center mb-4">

                        <h3 class="mb-0">
                            Character List
                        </h3>

                        <select class="form-select form-select-sm" id="raceFilter" style="width: 200px;">

                            <option value="all">
                                All Races
                            </option>

                        </select>

                    </div>

                    <div class="row g-3" id="characterContainer">

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Modal -->
    <div class="modal fade" id="characterModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Character Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="row">

                        <div class="col-md-5 text-center">
                            <img id="charactersImg" class="img-fluid rounded" style="max-height: 300px;">
                        </div>

                        <div class="col-md-7">
                            <h3 id="charactersName"></h3>

                            <p><strong>Age:</strong> <span id="charactersAge"></span></p>
                            <p><strong>Gender:</strong> <span id="charactersGender"></span></p>
                            <p><strong>Race:</strong> <span id="charactersRace"></span></p>

                            <p class="mt-3">
                                <strong>Description:</strong><br>
                                <span id="charactersDescription"></span>
                            </p>

                            <p class="mt-3 fst-italic">
                                "<span id="charactersQuote"></span>"
                            </p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        // ELEMENTS
        const container = document.getElementById("characterContainer");
        const searchInput = document.querySelector("input[type='search']");
        const raceFilter = document.getElementById("raceFilter");

        // DATA
        let allCharacters = [];
        let selectedRace = "all";

        // Get race badge color
        function getRaceColor(race) {

            const value = (race || "").toLowerCase();

            if (value === "human") return "bg-primary";
            if (value === "demon") return "bg-danger";

            return "bg-secondary";
        }

        // Create card HTML
        function createCharacterCard(c) {

            return `
        <div class="col-12">
            <div class="card mb-2 character-card shadow-sm"
                data-id='${JSON.stringify(c)}'
                style="cursor:pointer">

                <div class="card-body d-flex justify-content-between align-items-center">

                    <div style="min-width:120px;">
                        <strong>No. ${c.id || "N/A"}</strong>
                    </div>

                    <div style="flex:1;">
                        <h5 class="mb-0">
                            ${c.name || "Unknown"}
                        </h5>
                    </div>

                    <div style="min-width:120px; text-align:right;">
                        <span class="badge ${getRaceColor(c.race)}">
                            ${c.race || "N/A"}
                        </span>
                    </div>

                </div>
            </div>
        </div>
        `;
        }

        // Open modal
        function openModal(character) {

            document.getElementById("charactersImg").src =
                character.img || character.image || "";

            document.getElementById("charactersName").textContent =
                character.name || "Unknown";

            document.getElementById("charactersAge").textContent =
                character.age || "N/A";

            document.getElementById("charactersGender").textContent =
                character.gender || "N/A";

            document.getElementById("charactersRace").textContent =
                character.race || "N/A";

            document.getElementById("charactersDescription").textContent =
                character.description || "No description available.";

            document.getElementById("charactersQuote").textContent =
                character.quote || "No quote available.";

            new bootstrap.Modal(
                document.getElementById("characterModal")
            ).show();
        }

        // Attach click events
        function attachCardEvents() {

            document.querySelectorAll(".character-card")
                .forEach(card => {

                    card.addEventListener("click", () => {

                        const character =
                            JSON.parse(card.dataset.id);

                        openModal(character);
                    });

                });
        }

        // Render characters
        function renderCharacters(data) {

            if (!data.length) {

                container.innerHTML = `
                <div class="col-12">
                    <div class="alert alert-danger text-center">
                        No characters found.
                    </div>
                </div>
            `;

                return;
            }

            container.innerHTML =
                data.map(createCharacterCard).join("");

            attachCardEvents();
        }

        // Fill race dropdown
        function fillRaceOptions(data) {

            const races = [
                ...new Set(
                    data
                        .map(c => c.race)
                        .filter(Boolean)
                )
            ];

            raceFilter.innerHTML = `
            <option value="all">All Races</option>
            ${races.map(r =>
                `<option value="${r}">${r}</option>`
            ).join("")}
        `;
        }

        // FILTER FUNCTIONS
        function applyFilters() {

            const searchValue =
                searchInput.value.toLowerCase();

            const filtered = allCharacters

                .filter(c => {

                    return (
                        (c.name || "")
                            .toLowerCase()
                            .includes(searchValue)

                        ||

                        (c.race || "")
                            .toLowerCase()
                            .includes(searchValue)

                        ||

                        String(c.id)
                            .includes(searchValue)
                    );
                })

                .filter(c => {

                    return (
                        selectedRace === "all"
                        ||
                        c.race === selectedRace
                    );
                });

            renderCharacters(filtered);
        }


        // FETCH DATA
        async function getCharacters() {
            try {
                const response = await fetch(
                    "https://www.demonslayer-api.com/api/v1/characters?limit=45&page=1"
                );

                const data = await response.json();

                allCharacters = data.content || [];

                renderCharacters(allCharacters);
                fillRaceOptions(allCharacters);

            } catch (error) {
                console.error(error);

                container.innerHTML = `
            <div class="col-12">
                <div class="alert alert-danger text-center">
                    Failed to load characters.
                </div>
            </div>
        `;
            }
        }

        // EVENTS
        searchInput.addEventListener("input", applyFilters);

        raceFilter.addEventListener("change", (e) => {

            selectedRace = e.target.value;

            applyFilters();
        });

        getCharacters();

    </script>

    <script>
        function autoCloseNavbar() {
            const navbar = document.getElementById("navbarNav");

            const bsCollapse = bootstrap.Collapse.getInstance(navbar);

            if (bsCollapse) {
                bsCollapse.hide();
            }
        }

        document.querySelectorAll(".navbar-nav .nav-link")
            .forEach(link => {
                link.addEventListener("click", autoCloseNavbar);
            });
    </script>

</body>

</html>
